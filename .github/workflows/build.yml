name: Build Mania Plus (Full)

on:
  workflow_dispatch:
  push:
    paths:
      - dependencies/**
      - SonicMania/**
      - .github/workflows/build.yml
      - CMakeLists.txt
    branches:
      - master

env:
  GENERAL_FLAGS: "-DWITH_RSDK=ON -DCMAKE_BUILD_TYPE=Release -DRETRO_DISABLE_PLUS=OFF"
  V5U_FLAGS: "-DRETRO_REVISION=3"
  GENERAL_WIN_FLAGS: "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
  WIN64_FLAGS: "-DVCPKG_TARGET_TRIPLET=x64-windows-static"

jobs:
  mania-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies (vcpkg)
        run: |
          C:/vcpkg/vcpkg.exe install libtheora libogg glew glfw3 sdl2 --triplet=x64-windows-static

      - name: Build Mania Plus & RSDKv5
        run: |
          cmake -B build_v5U ${{env.GENERAL_FLAGS}} ${{env.GENERAL_WIN_FLAGS}} ${{env.WIN64_FLAGS}} ${{env.V5U_FLAGS}}
          cmake --build build_v5U --parallel --config Release

      - name: Collect Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/v5U
          Get-ChildItem -Path ./build_v5U -Recurse -Include *.dll,*.exe | Where-Object { $_.FullName -like "*Release*" } | Copy-Item -Destination ./artifacts/v5U/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mania-plus-windows-x64
          path: artifacts/v5U
